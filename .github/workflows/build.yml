name: build

# 只在 main 上构建。
# 不打 tag、不建 Release：产物从 Actions 的 artifact 下载后本地留存。
# 文档 / 说明的改动不触发构建 —— 那些提交不该占用构建额度。
on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'dist/**'
      - '.gitignore'
      - '.gitattributes'
  workflow_dispatch:

permissions:
  contents: read

# 连续 push 只保留最后一次。
concurrency:
  group: build-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 20
    env:
      THEOS: ${{ github.workspace }}/.theos

    steps:
      - uses: actions/checkout@v4

      # 缓存 key 随工具链变化。v2 = 首个 Swift 版本。
      - name: Restore Theos + SDK cache
        id: cache
        uses: actions/cache@v4
        with:
          path: .theos
          key: theos-roothide-macos14-sdk16.5-swift-v2

      - name: Install Theos (roothide branch)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          git clone --recursive --depth 1 https://github.com/roothide/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks
          git -C /tmp/sdks sparse-checkout set iPhoneOS16.5.sdk
          cp -R /tmp/sdks/iPhoneOS16.5.sdk "$THEOS/sdks/"

      # ldid 只在第一次装；brew 的下载缓存单独存，省掉 30–60 秒。
      - name: Cache Homebrew downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: brew-downloads-ldid-v1

      - name: Preflight (toolchain, version, arch, architecture promise)
        run: |
          set -euxo pipefail
          test -d "$THEOS/makefiles"
          test -d "$THEOS/sdks/iPhoneOS16.5.sdk"

          if [ -x "$THEOS/bin/ldid" ]; then echo "ldid: theos"; 
          elif command -v ldid >/dev/null 2>&1; then echo "ldid: system";
          else brew install ldid; fi

          python3 --version
          xcrun --find swiftc

          V="$(awk -F': ' '/^Version:/{print $2; exit}' control)"
          A="$(awk -F': ' '/^Architecture:/{print $2; exit}' control)"
          test "$A" = "iphoneos-arm64e"
          grep -q "version = \"$V\"" Sources/Core/Paths.swift
          grep -q "<string>$V</string>" layout/Library/PreferenceBundles/AevonPrefs.bundle/Info.plist
          # 编译承诺不许被后来的提交悄悄改掉
          grep -q 'export ARCHS := arm64e' Makefile
          grep -q 'THEOS_PACKAGE_SCHEME := roothide' Makefile
          echo "preflight ok: $V / $A / swift"

      - name: Build (one package, no clean)
        run: |
          set -euxo pipefail
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide
          ls -la packages/
          test "$(ls packages/*.deb | wc -l | tr -d ' ')" -eq 1

      - name: Gate — audit package payload
        run: |
          set -euxo pipefail
          bash ./tools/audit-deb.sh "$(ls packages/*.deb | head -1)"

      - name: Name artifact
        run: |
          set -euxo pipefail
          bash ./tools/name-deb.sh packages dist
          ls -la dist/

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: aevon-deb
          path: dist/com.Aevon_*.deb
          if-no-files-found: error
          retention-days: 30
